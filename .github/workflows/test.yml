name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # All three platforms on purpose. Development happens on macOS; Linux ships a
    # different /bin/sh (the shell config parser is POSIX-sensitive); and Windows
    # runs under Git Bash with a native `python` (no `python3`) — the exact
    # environment the OS-aware paths exist for. Without a Windows runner the
    # Windows support can regress silently.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
        # 3.9 is not offered for the arm64 macOS runner setup-python uses.
        exclude:
          - os: macos-latest
            python: '3.9'

    # Run every step under bash on all three OSes. GitHub's Windows runners ship
    # Git Bash, so the POSIX `run:` bodies and `bash tests/*.sh` steps behave the
    # same everywhere. Steps invoke the interpreter as `python` (setup-python
    # provides it on all platforms; `python3` is not reliable on Windows).
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install extra shells
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash ksh zsh

      - name: Bootstrap
        run: bash install/bootstrap.sh

      # The keyword path must work with no third-party packages at all — it is
      # the fallback everything else degrades to.
      - name: Core works with zero dependencies
        run: |
          export KB_RETRIEVER=keyword
          ./bin/kb --help
          ./bin/kb context
          ./bin/kb recall "timeout on startup"
          ./bin/kb health

      - name: Config and scope resolution
        run: python tests/test_config.py

      - name: Claude settings merge is non-destructive
        run: python tests/test_settings_merge.py

      - name: Shell/Python parser parity
        run: bash tests/test_parser_parity.sh

      - name: Hook behaviour
        run: bash tests/test_hooks.sh

      # The Windows secret backend is DPAPI (PowerShell), a code path neither
      # macOS Keychain nor libsecret exercises. Assert the round-trip explicitly
      # rather than leaning on its incidental use inside kb-selftest.
      - name: Windows secret store (DPAPI) round-trips
        if: runner.os == 'Windows'
        run: |
          export KB_SECRET_INDEX="$RUNNER_TEMP/idx"
          printf 'ci-dpapi-value\n' | ./bin/secret put ci.dpapi.test
          got="$(./bin/secret get ci.dpapi.test)"
          [ "$got" = "ci-dpapi-value" ] || { echo "::error::DPAPI round-trip returned '$got'"; exit 1; }
          # Invalid aliases must be refused, not silently coerced onto a filename.
          if ./bin/secret get 'a/b' 2>/dev/null; then
            echo "::error::secret accepted an invalid alias"; exit 1; fi

      - name: Selftest reports DEGRADED without the extras
        run: |
          out="$(./bin/kb-selftest 2>&1)" || true
          echo "$out"
          # Semantic is unavailable here, so claiming plain OK would be a lie.
          echo "$out" | grep -q "DEGRADED" || {
            echo "::error::kb-selftest did not report DEGRADED without the extras"; exit 1; }

      - name: Weekly deterministic steps
        run: bash weekly/run-weekly.sh --no-agent

      - name: No generated state is committable
        run: |
          git status --porcelain > "$RUNNER_TEMP/dirty"
          if [ -s "$RUNNER_TEMP/dirty" ]; then
            echo "::error::running the harness left stageable files:"; cat "$RUNNER_TEMP/dirty"; exit 1
          fi

  extras:
    # Semantic search needs a venv and native wheels. No embedding backend runs
    # in CI, so this proves the machinery installs and that recall degrades
    # cleanly rather than crashing when the backend is absent. Ubuntu only: the
    # sqlite-vec wheel is reliably available here, whereas its availability on
    # the Windows/macOS-arm runners is an external constraint that install-extras
    # already detects and reports at install time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash install/bootstrap.sh
      - run: bash install/install-extras.sh
      - name: Index build fails cleanly with no backend
        run: |
          set +e
          ./bin/kb index; rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "::error::kb index should fail without a backend"; exit 1; }
      - name: Recall still works via keyword fallback
        run: ./bin/kb recall "timeout on startup"
      - name: Retriever reports unavailable rather than crashing
        run: |
          set +e
          ./bin/kb index --check; rc=$?
          set -e
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2 (fall back), got $rc"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets or private data in the tree
        run: bash scripts/scan-secrets.sh
